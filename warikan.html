<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMNF割り勘奉行</title>
  <meta name="theme-color" content="#1A237E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="割り勘奉行">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --white:#ffffff; --navy:#1A237E; --coral:#FF6B6B; --teal:#00BFA5;
      --yellow:#FFD600; --purple:#7C4DFF; --orange:#FF6D00;
      --text:#2D2D2D; --gray:#9E9E9E; --light:#F5F5F5;
    }
    body { font-family:"M PLUS Rounded 1c","Hiragino Kaku Gothic ProN",sans-serif; background:linear-gradient(160deg,#E8EEFF 0%,#F0FFF8 100%); min-height:100vh; color:var(--text); }
    header { background:linear-gradient(135deg,#1A237E 0%,#283593 60%,#3949AB 100%); padding:0 20px; height:58px; display:flex; align-items:center; gap:10px; box-shadow:0 4px 20px rgba(26,35,126,0.3); position:sticky; top:0; z-index:50; }
    .logo-wrap { display:flex; align-items:center; gap:10px; }
    .logo-emoji { font-size:1.6rem; }
    .logo-title { color:#fff; font-size:1rem; font-weight:800; }
    .logo-title span { color:var(--yellow); }
    .hero { background:linear-gradient(135deg,#1A237E 0%,#3949AB 50%,#5C6BC0 100%); padding:28px 20px 40px; text-align:center; position:relative; overflow:hidden; }
    .hero-badge { display:inline-block; background:var(--yellow); color:var(--navy); font-size:0.68rem; font-weight:800; padding:3px 12px; border-radius:20px; letter-spacing:0.1em; margin-bottom:12px; }
    .hero h1 { color:#fff; font-size:clamp(1.5rem,6vw,2.2rem); font-weight:900; line-height:1.2; }
    .hero h1 em { font-style:normal; color:var(--yellow); }
    .hero-sub { color:rgba(255,255,255,0.65); font-size:0.78rem; margin-top:8px; }
    .hero-wave { position:absolute; bottom:-1px; left:0; right:0; height:24px; overflow:hidden; }
    .hero-wave svg { display:block; width:100%; height:100%; }
    main { max-width:640px; margin:0 auto; padding:20px 14px 100px; }
    .card { background:var(--white); border-radius:20px; box-shadow:0 4px 24px rgba(0,0,0,0.08); padding:20px 18px; margin-bottom:16px; }
    .card-title { display:flex; align-items:center; gap:8px; font-size:0.82rem; font-weight:800; color:var(--navy); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:14px; }
    .card-title .icon { width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:0.9rem; }
    .total-wrap { position:relative; }
    .total-wrap input { width:100%; padding:14px 48px 14px 20px; border:2.5px solid #E0E0E0; border-radius:14px; font-size:1.8rem; font-weight:900; color:var(--navy); font-family:"M PLUS Rounded 1c",sans-serif; background:#FAFAFE; transition:border-color 0.2s; }
    .total-wrap input:focus { outline:none; border-color:var(--purple); box-shadow:0 0 0 4px rgba(124,77,255,0.12); }
    .total-wrap .yen { position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:1rem; font-weight:800; color:var(--gray); }
    .round-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .round-btn { padding:10px 4px; border:2px solid #E0E0E0; border-radius:12px; background:var(--light); cursor:pointer; font-size:0.72rem; font-weight:700; color:var(--gray); text-align:center; transition:all 0.15s; font-family:"M PLUS Rounded 1c",sans-serif; }
    .round-btn.active { border-color:var(--purple); background:#EDE7FF; color:var(--purple); }
    .pattern-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .pattern-btn { padding:14px 10px; border:2.5px solid #E0E0E0; border-radius:16px; background:var(--light); cursor:pointer; text-align:center; transition:all 0.18s; position:relative; overflow:hidden; }
    .pattern-btn::before { content:""; position:absolute; inset:0; opacity:0; transition:opacity 0.18s; }
    .pattern-btn:nth-child(1)::before { background:linear-gradient(135deg,#E3F2FD,#B3E5FC); }
    .pattern-btn:nth-child(2)::before { background:linear-gradient(135deg,#E8F5E9,#B2DFDB); }
    .pattern-btn:nth-child(3)::before { background:linear-gradient(135deg,#FFF8E1,#FFE082); }
    .pattern-btn:nth-child(4)::before { background:linear-gradient(135deg,#FCE4EC,#F8BBD0); }
    .pattern-btn.active::before { opacity:1; }
    .pattern-btn:nth-child(1) { --pc:#0288D1; }
    .pattern-btn:nth-child(2) { --pc:#00897B; }
    .pattern-btn:nth-child(3) { --pc:#F57F17; }
    .pattern-btn:nth-child(4) { --pc:#C2185B; }
    .pattern-btn.active { border-color:var(--pc,var(--purple)); }
    .p-emoji { font-size:1.6rem; display:block; margin-bottom:6px; position:relative; z-index:1; }
    .p-name { font-size:0.9rem; font-weight:800; color:var(--text); margin-bottom:4px; position:relative; z-index:1; }
    .pattern-btn.active .p-name { color:var(--pc,var(--purple)); }
    .p-bars { display:flex; align-items:flex-end; justify-content:center; gap:3px; height:18px; margin-bottom:4px; position:relative; z-index:1; }
    .p-bar { width:5px; background:#D0D0D0; border-radius:2px; }
    .pattern-btn.active .p-bar { background:var(--pc,var(--purple)); }
    .p-desc { font-size:0.65rem; color:var(--gray); position:relative; z-index:1; line-height:1.4; }
    .pattern-btn.active .p-desc { color:var(--pc,var(--purple)); }
    .role-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .role-item { background:var(--light); border-radius:14px; padding:12px 10px; display:flex; flex-direction:column; align-items:center; gap:8px; }
    .role-name-badge { font-size:1rem; font-weight:900; color:var(--navy); letter-spacing:0.08em; }
    .stepper { display:flex; align-items:center; background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08); overflow:hidden; width:100%; }
    .stepper-btn { width:40px; height:40px; border:none; background:none; cursor:pointer; font-size:1.3rem; font-weight:900; display:flex; align-items:center; justify-content:center; transition:background 0.15s; flex-shrink:0; font-family:"M PLUS Rounded 1c",sans-serif; }
    .stepper-btn:active { background:#E8EAF6; }
    .stepper-btn.minus { color:var(--coral); }
    .stepper-btn.plus  { color:var(--teal); }
    .stepper-val { flex:1; text-align:center; font-size:1.3rem; font-weight:900; color:var(--navy); font-family:"M PLUS Rounded 1c",sans-serif; }
    .stepper-val.zero { color:var(--gray); }
    .balance-section { margin-top:16px; }
    .balance-title { font-size:0.72rem; font-weight:800; color:var(--gray); letter-spacing:0.08em; margin-bottom:8px; }
    .balance-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .balance-label { width:30px; font-weight:800; color:var(--navy); font-size:0.82rem; }
    .balance-track { flex:1; height:10px; background:#E0E0E0; border-radius:5px; overflow:hidden; }
    .balance-fill { height:100%; border-radius:5px; transition:width 0.4s; background:linear-gradient(90deg,var(--teal),var(--purple)); }
    .balance-amount { width:72px; text-align:right; font-weight:800; color:var(--purple); font-size:0.75rem; }
    .balance-empty { color:var(--gray); font-size:0.78rem; text-align:center; padding:10px 0; }
    .balance-warn { margin-top:8px; padding:10px 12px; background:#FFF3E0; border-left:4px solid var(--orange); border-radius:10px; font-size:0.75rem; color:#E65100; line-height:1.6; }
    .btn-calc { display:block; width:100%; padding:18px; background:linear-gradient(135deg,var(--coral),var(--orange)); color:#fff; border:none; border-radius:16px; font-size:1.05rem; font-weight:900; letter-spacing:0.08em; cursor:pointer; transition:transform 0.15s,box-shadow 0.15s; box-shadow:0 6px 20px rgba(255,107,107,0.4); font-family:"M PLUS Rounded 1c",sans-serif; }
    .btn-calc:hover { transform:translateY(-2px); }
    .btn-calc:active { transform:translateY(0); }
    #result { display:none; }
    .result-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    .result-chip { background:var(--light); border-radius:20px; padding:5px 14px; font-size:0.75rem; font-weight:700; color:var(--navy); }
    .result-chip strong { color:var(--purple); }
    .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:12px; overflow:hidden; }
    table { width:100%; border-collapse:collapse; font-size:0.86rem; min-width:280px; }
    thead th { background:var(--navy); color:rgba(255,255,255,0.9); padding:10px 12px; text-align:left; font-size:0.72rem; font-weight:800; }
    thead th:not(:first-child) { text-align:right; }
    tbody td { padding:11px 12px; border-bottom:1px solid #F0F0F0; }
    tbody td:not(:first-child) { text-align:right; }
    tbody tr:last-child td { border-bottom:none; }
    .td-role { font-weight:900; color:var(--navy); font-size:1rem; }
    .td-amount { font-weight:700; color:#00695C; }
    .td-collect { font-weight:900; color:var(--purple); }
    tfoot td { padding:11px 12px; background:#F5F0FF; font-weight:900; font-size:0.85rem; }
    tfoot td:not(:first-child) { text-align:right; }
    tfoot .td-collect { color:var(--purple); font-size:1rem; }
    .collect-summary { margin-top:12px; padding:14px 16px; background:linear-gradient(135deg,#EDE7FF,#E3F2FD); border-radius:14px; }
    .collect-summary-title { font-size:0.7rem; color:var(--purple); font-weight:800; letter-spacing:0.1em; margin-bottom:8px; }
    .collect-row { display:flex; justify-content:space-between; font-size:0.82rem; margin-bottom:4px; }
    .collect-row span { color:var(--gray); font-weight:700; }
    .collect-row strong { color:var(--navy); font-weight:800; }
    .collect-surplus { color:var(--teal) !important; }
    .bar-section { margin-top:16px; }
    .bar-title { font-size:0.7rem; font-weight:800; color:var(--gray); margin-bottom:8px; }
    .bar-row { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
    .bar-label { width:30px; font-weight:900; color:var(--navy); font-size:0.82rem; }
    .bar-track { flex:1; height:14px; background:#EEE; border-radius:7px; overflow:hidden; }
    .bar-fill { height:100%; border-radius:7px; background:linear-gradient(90deg,var(--teal),var(--purple)); transition:width 0.5s; }
    .bar-val { width:72px; text-align:right; font-weight:800; color:var(--purple); font-size:0.78rem; }
    .note { font-size:0.68rem; color:var(--gray); margin-top:10px; text-align:right; font-weight:700; }
    footer { background:var(--navy); color:rgba(255,255,255,0.4); font-size:0.7rem; text-align:center; padding:14px; font-weight:700; }
  </style>
</head>
<body>
<header>
  <div class="logo-wrap">
    <span class="logo-emoji">&#x2696;&#xFE0F;</span>
    <div class="logo-title">TMNF<span>&#x5272;&#x308A;&#x52D8;&#x5949;&#x884C;</span></div>
  </div>
</header>
<div class="hero">
  <div class="hero-badge">&#x1F37A; COMPANY PARTY SPLIT &#x1F389;</div>
  <h1>TMNF<em>&#x5272;&#x308A;&#x52D8;&#x5949;&#x884C;</em></h1>
  <p class="hero-sub">&#x4EBA;&#x6570;&#x3092;&#x9078;&#x3093;&#x3067;&#x30D1;&#x30BF;&#x30FC;&#x30F3;&#x3092;&#x9078;&#x3076;&#x3060;&#x3051;&#xFF01;&#x2728;</p>
  <div class="hero-wave"><svg viewBox="0 0 1200 24" preserveAspectRatio="none"><path d="M0,12 C200,24 400,0 600,12 C800,24 1000,0 1200,12 L1200,24 L0,24 Z" fill="#E8EEFF"/></svg></div>
</div>
<main>
  <div class="card">
    <div class="card-title"><div class="icon" style="background:#EDE7FF">&#x1F4B0;</div>&#x5408;&#x8A08;&#x91D1;&#x984D;</div>
    <div class="total-wrap">
      <input type="number" id="total" placeholder="0" min="0" inputmode="numeric" oninput="updateBalance()">
      <span class="yen">&#x5186;</span>
    </div>
  </div>
  <div class="card">
    <div class="card-title"><div class="icon" style="background:#E8F5E9">&#x1FA99;</div>&#x96C6;&#x91D1;&#x5358;&#x4F4D;&#xFF08;&#x7AEF;&#x6570;&#x306E;&#x5207;&#x308A;&#x4E0A;&#x3052;&#xFF09;</div>
    <div class="round-grid">
      <button class="round-btn" onclick="setRound(1)">&#x305D;&#x306E;&#x307E;&#x307E;</button>
      <button class="round-btn active" onclick="setRound(100)">100&#x5186;</button>
      <button class="round-btn" onclick="setRound(500)">500&#x5186;</button>
      <button class="round-btn" onclick="setRound(1000)">1,000&#x5186;</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title"><div class="icon" style="background:#FFF8E1">&#x1F4CA;</div>&#x50BE;&#x659C;&#x30D1;&#x30BF;&#x30FC;&#x30F3;</div>
    <div class="pattern-grid" id="pattern-grid"></div>
  </div>
  <div class="card">
    <div class="card-title"><div class="icon" style="background:#FCE4EC">&#x1F465;</div>&#x5F79;&#x8077;&#x5225;&#x4EBA;&#x6570;</div>
    <div class="role-grid" id="role-inputs"></div>
    <div class="balance-section">
      <div class="balance-title">&#x1F4C8; &#x8CA0;&#x62C5;&#x30D0;&#x30E9;&#x30F3;&#x30B9;&#x8A66;&#x7B97;</div>
      <div id="balance-preview"><div class="balance-empty">&#x4EBA;&#x6570;&#x3068;&#x91D1;&#x984D;&#x3092;&#x5165;&#x529B;&#x3059;&#x308B;&#x3068;&#x8A66;&#x7B97;&#x304C;&#x8868;&#x793A;&#x3055;&#x308C;&#x307E;&#x3059;</div></div>
    </div>
  </div>
  <button class="btn-calc" onclick="calculate()">&#x1F37A; &#x5272;&#x308A;&#x52D8;&#x3092;&#x8A08;&#x7B97;&#x3059;&#x308B;&#xFF01;</button>
  <div class="card" id="result" style="margin-top:16px;">
    <div class="card-title"><div class="icon" style="background:#E8F5E9">&#x2705;</div>&#x8A08;&#x7B97;&#x7D50;&#x679C;</div>
    <div class="result-chips">
      <div class="result-chip">&#x5408;&#x8A08; <strong id="res-total"></strong></div>
      <div class="result-chip">&#x53C2;&#x52A0;&#x8005; <strong id="res-count"></strong> &#x540D;</div>
      <div class="result-chip">&#x30D1;&#x30BF;&#x30FC;&#x30F3; <strong id="res-pattern"></strong></div>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>&#x5F79;&#x8077;</th><th>&#x4EBA;&#x6570;</th><th>1&#x4EBA;&#x3042;&#x305F;&#x308A;</th><th>&#x96C6;&#x91D1;&#x984D;/&#x4EBA;</th><th>&#x5C0F;&#x8A08;</th></tr></thead>
        <tbody id="res-body"></tbody>
        <tfoot id="res-foot"></tfoot>
      </table>
    </div>
    <div class="collect-summary" id="collect-summary"></div>
    <div class="bar-section">
      <div class="bar-title">1&#x4EBA;&#x3042;&#x305F;&#x308A;&#x96C6;&#x91D1;&#x984D;&#x306E;&#x6BD4;&#x8F03;</div>
      <div id="bar-wrap"></div>
    </div>
    <p class="note">&#x203B; &#x96C6;&#x91D1;&#x984D;&#x306F;&#x8CA0;&#x62C5;&#x984D;&#x3092;&#x5207;&#x308A;&#x4E0A;&#x3052;&#x305F;&#x91D1;&#x984D;&#x3067;&#x3059;</p>
  </div>
</main>
<footer>TMNF&#x5272;&#x308A;&#x52D8;&#x5949;&#x884C; &#x2014; &#x793E;&#x5185;&#x7528;&#x30C4;&#x30FC;&#x30EB;</footer>
<script>
  const ROLES=["DH","SC","MG","UL","SA","A"];
  const PATTERNS=[
    {name:"気持ち傾斜",emoji:"🌊",desc:"ほんのり差をつける",rates:[1.5,1.3,1.15,1.05,1.0,0.85],heights:[18,14,11,9,8,6]},
    {name:"普通",emoji:"⚖️",desc:"自然な役職の差",rates:[2.2,1.8,1.4,1.15,0.95,0.7],heights:[20,16,12,10,8,5]},
    {name:"太っ腹",emoji:"😄",desc:"上がドカンと負担",rates:[3.0,2.3,1.7,1.2,0.8,0.55],heights:[20,15,11,8,5,3]},
    {name:"大盤振る舞い",emoji:"🎊",desc:"上位ががっつり持つ！",rates:[4.0,2.8,1.9,1.1,0.65,0.4],heights:[20,14,9,6,3,2]},
  ];
  let selectedPattern=1,roundUnit=100;
  const counts=[0,0,0,0,0,0];
  function setRound(u){roundUnit=u;document.querySelectorAll(".round-btn").forEach((b,i)=>b.classList.toggle("active",[1,100,500,1000][i]===u));updateBalance();}
  function roundUp(v,u){return u<=1?Math.round(v):Math.ceil(v/u)*u;}
  function renderPatterns(){
    document.getElementById("pattern-grid").innerHTML=PATTERNS.map((p,i)=>{
      const bars=p.heights.map(h=>`<div class="p-bar" style="height:${h}px"></div>`).join("");
      return `<div class="pattern-btn ${i===selectedPattern?"active":""}" onclick="selectPattern(${i})">
        <span class="p-emoji">${p.emoji}</span>
        <div class="p-name">${p.name}</div>
        <div class="p-bars">${bars}</div>
        <div class="p-desc">${p.desc}</div>
      </div>`;
    }).join("");
  }
  function selectPattern(i){selectedPattern=i;renderPatterns();updateBalance();}
  function renderInputs(){
    document.getElementById("role-inputs").innerHTML=ROLES.map((r,i)=>`
      <div class="role-item">
        <div class="role-name-badge">${r}</div>
        <div class="stepper">
          <button class="stepper-btn minus" onclick="changeCount(${i},-1)">&#x2212;</button>
          <span class="stepper-val ${counts[i]===0?"zero":""}" id="sv-${i}">${counts[i]}</span>
          <button class="stepper-btn plus" onclick="changeCount(${i},+1)">&#xFF0B;</button>
        </div>
      </div>`).join("");
  }
  function changeCount(i,d){counts[i]=Math.max(0,counts[i]+d);const e=document.getElementById(`sv-${i}`);e.textContent=counts[i];e.className="stepper-val"+(counts[i]===0?" zero":"");updateBalance();}
  function updateBalance(){
    const total=parseInt(document.getElementById("total").value)||0;
    const rates=PATTERNS[selectedPattern].rates;
    const tp=counts.reduce((s,c)=>s+c,0);
    const el=document.getElementById("balance-preview");
    if(tp===0||total===0){el.innerHTML=`<div class="balance-empty">人数と合計金額を入力すると試算が表示されます</div>`;return;}
    const tr=counts.reduce((s,c,i)=>s+c*rates[i],0);
    const u=total/tr;
    const pp=rates.map(r=>u*r);
    const mx=Math.max(...ROLES.map((_,i)=>counts[i]>0?pp[i]:0));
    const warns=[];
    ROLES.forEach((r,i)=>{if(counts[i]!==1)return;const s=pp[i]/total*100;if(s>40)warns.push(`⚠️ ${r} の1名が全体の${s.toFixed(0)}%（${Math.round(pp[i]).toLocaleString()}円）を負担します`);});
    let html=ROLES.map((r,i)=>{
      if(counts[i]===0)return"";
      const pct=mx>0?(pp[i]/mx*100).toFixed(0):0;
      const c=roundUp(pp[i],roundUnit);
      return `<div class="balance-row"><span class="balance-label">${r}</span><div class="balance-track"><div class="balance-fill" style="width:${pct}%"></div></div><span class="balance-amount">${c.toLocaleString()}円</span></div>`;
    }).join("");
    if(warns.length)html+=`<div class="balance-warn">${warns.join("<br>")}</div>`;
    el.innerHTML=html;
  }
  function calculate(){
    const total=parseInt(document.getElementById("total").value);
    if(!total||total<=0)return alert("合計金額を入力してください");
    const tp=counts.reduce((s,c)=>s+c,0);
    if(tp===0)return alert("参加者の人数を選択してください");
    const rates=PATTERNS[selectedPattern].rates;
    const tr=counts.reduce((s,c,i)=>s+c*rates[i],0);
    const u=total/tr;
    const pe=rates.map(r=>u*r);
    const pc=pe.map(v=>roundUp(v,roundUnit));
    const sc=counts.map((c,i)=>c*pc[i]);
    const gc=sc.reduce((s,v)=>s+v,0);
    const surplus=gc-total;
    const mx=Math.max(...ROLES.map((_,i)=>counts[i]>0?pc[i]:0));
    let rows="",gcnt=0;
    ROLES.forEach((r,i)=>{
      if(counts[i]===0)return;
      gcnt+=counts[i];
      rows+=`<tr><td class="td-role">${r}</td><td>${counts[i]} 名</td><td class="td-amount">${Math.round(pe[i]).toLocaleString()}円</td><td class="td-collect">${pc[i].toLocaleString()}円</td><td class="td-collect">${sc[i].toLocaleString()}円</td></tr>`;
    });
    document.getElementById("res-body").innerHTML=rows;
    document.getElementById("res-foot").innerHTML=`<tr><td>合計</td><td>${gcnt}名</td><td>—</td><td>—</td><td class="td-collect">${gc.toLocaleString()}円</td></tr>`;
    document.getElementById("collect-summary").innerHTML=`
      <div class="collect-summary-title">&#x1F4B0; COLLECTION SUMMARY</div>
      <div class="collect-row"><span>飲み会の実費</span><strong>${total.toLocaleString()} 円</strong></div>
      <div class="collect-row"><span>集金合計</span><strong>${gc.toLocaleString()} 円</strong></div>
      <div class="collect-row"><span>余剰金（次回積立など）</span><strong class="collect-surplus">&#xFF0B;${surplus.toLocaleString()} 円 &#x1F389;</strong></div>`;
    document.getElementById("bar-wrap").innerHTML=ROLES.map((r,i)=>{
      if(counts[i]===0)return"";
      const pct=mx>0?(pc[i]/mx*100).toFixed(0):0;
      return `<div class="bar-row"><span class="bar-label">${r}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-val">${pc[i].toLocaleString()}円</span></div>`;
    }).join("");
    document.getElementById("res-total").textContent=total.toLocaleString()+" 円";
    document.getElementById("res-count").textContent=tp;
    document.getElementById("res-pattern").textContent=PATTERNS[selectedPattern].name;
    const el=document.getElementById("result");
    el.style.display="block";
    el.scrollIntoView({behavior:"smooth"});
  }
  renderPatterns();
  renderInputs();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("/warikan/sw.js");
  }
</script>
</body>
</html>
