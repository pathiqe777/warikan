<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMNF割り勘奉行</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:  #002855;
      --navy2: #003A7A;
      --gold:  #C8922A;
      --gold2: #E8A830;
      --white: #ffffff;
      --light: #F4F7FB;
      --gray:  #6B7280;
      --text:  #1A2340;
      --green: #1B5E3B;
    }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--light);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--navy);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      position: sticky; top: 0; z-index: 50;
    }
    .logo-mark {
      width: 32px; height: 32px;
      background: var(--gold); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; color: #fff;
      cursor: pointer; flex-shrink: 0; letter-spacing: -0.5px;
    }
    .logo-text { color: #fff; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.04em; }
    .btn-settings {
      margin-left: auto;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.8);
      padding: 6px 12px; border-radius: 3px;
      cursor: pointer; font-size: 0.75rem;
      white-space: nowrap; transition: background 0.2s;
    }
    .btn-settings:hover { background: rgba(255,255,255,0.2); }
    @media (max-width:480px) {
      .btn-settings { font-size: 0; padding: 6px 10px; }
      .btn-settings::before { content: "⚙"; font-size: 1rem; }
    }

    /* GOLD BAR */
    .gold-bar { height: 3px; background: linear-gradient(90deg, var(--gold), var(--navy2)); }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #001836 0%, var(--navy) 60%, var(--navy2) 100%);
      padding: 28px 20px 36px;
      text-align: center;
      position: relative; overflow: hidden;
    }
    .hero::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse 70% 90% at 50% 50%, rgba(200,146,42,0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--gold2); font-size: 0.68rem; letter-spacing: 0.18em; font-weight: 700;
      margin-bottom: 10px;
    }
    .hero-eyebrow::before, .hero-eyebrow::after {
      content: ""; display: block; width: 16px; height: 1px; background: var(--gold2);
    }
    .hero h1 {
      color: #fff; font-size: clamp(1.3rem, 5vw, 1.7rem);
      font-weight: 500; letter-spacing: 0.04em;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      position: relative; z-index: 1;
    }
    .hero h1 span { color: var(--gold2); }
    .hero-sub {
      color: rgba(255,255,255,0.55); font-size: 0.75rem;
      margin-top: 8px; letter-spacing: 0.06em; position: relative; z-index: 1;
    }

    /* MAIN */
    main { max-width: 680px; margin: 0 auto; padding: 20px 14px 100px; }

    /* CARD */
    .card {
      background: var(--white);
      border-top: 3px solid var(--gold);
      border-radius: 2px;
      box-shadow: 0 2px 10px rgba(0,40,85,0.08);
      padding: 18px 18px 16px;
      margin-bottom: 14px;
    }
    .card-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 14px; padding-bottom: 10px;
      border-bottom: 1px solid #E5EAF2;
    }
    .card-header-dot { width: 7px; height: 7px; background: var(--gold); border-radius: 50%; }
    .card-header h2 {
      font-size: 0.8rem; color: var(--navy); font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
    }

    /* 合計金額 */
    .total-wrap { position: relative; }
    .total-wrap input {
      width: 100%; padding: 12px 44px 12px 14px;
      border: 1.5px solid #D1D9E6; border-radius: 4px;
      font-size: 1.6rem; font-weight: 700; color: var(--navy);
      transition: border-color 0.2s;
    }
    .total-wrap input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,146,42,0.12); }
    .total-wrap .yen { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--gray); font-size: 0.9rem; font-weight: 600; }

    /* 端数処理 */
    .round-btns { display: flex; gap: 8px; }
    .round-btn {
      flex: 1; padding: 10px 4px;
      border: 1.5px solid #D1D9E6; border-radius: 4px;
      background: var(--light); cursor: pointer;
      font-size: 0.82rem; font-weight: 600; color: var(--gray);
      text-align: center; transition: all 0.15s;
    }
    .round-btn:hover { border-color: var(--gold); color: var(--navy); }
    .round-btn.active { border-color: var(--gold); background: #FDF6EC; color: var(--gold); box-shadow: 0 0 0 2px rgba(200,146,42,0.15); }

    /* 傾斜パターン */
    .pattern-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .pattern-btn {
      padding: 10px 4px 9px;
      border: 1.5px solid #D1D9E6; border-radius: 4px;
      background: var(--light); cursor: pointer;
      text-align: center; transition: all 0.15s;
    }
    .pattern-btn:hover { border-color: var(--gold); background: #FDF6EC; }
    .pattern-btn.active { border-color: var(--gold); background: #FDF6EC; box-shadow: 0 0 0 2px rgba(200,146,42,0.2); }
    .p-name { font-size: 0.8rem; font-weight: 700; color: var(--navy); margin-bottom: 5px; }
    .pattern-btn.active .p-name { color: var(--gold); }
    .p-bars { display: flex; align-items: flex-end; justify-content: center; gap: 2px; height: 20px; }
    .p-bar { width: 5px; background: #D1D9E6; border-radius: 1px; }
    .pattern-btn.active .p-bar { background: var(--gold2); }
    .p-desc { font-size: 0.62rem; color: var(--gray); margin-top: 4px; line-height: 1.4; }
    .pattern-btn.active .p-desc { color: var(--gold); }

    /* 役職人数 */
    .role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .role-item {}
    .role-label { display: flex; align-items: center; margin-bottom: 5px; }
    .role-name { font-size: 1rem; font-weight: 700; color: var(--navy); letter-spacing: 0.06em; }
    .role-item input {
      width: 100%; padding: 11px 8px;
      border: 1.5px solid #D1D9E6; border-radius: 4px;
      font-size: 1rem; font-weight: 600; color: var(--navy);
      text-align: center; min-height: 44px;
      transition: border-color 0.2s;
    }
    .role-item input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,146,42,0.12); }

    /* バランス試算 */
    .balance-section { margin-top: 14px; }
    .balance-title {
      font-size: 0.7rem; color: var(--gray); letter-spacing: 0.1em;
      font-weight: 700; margin-bottom: 8px; text-transform: uppercase;
    }
    .balance-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 5px; font-size: 0.78rem;
    }
    .balance-label { width: 28px; font-weight: 700; color: var(--navy); font-size: 0.82rem; }
    .balance-track { flex: 1; height: 10px; background: #E5EAF2; border-radius: 2px; overflow: hidden; }
    .balance-fill { height: 100%; border-radius: 2px; transition: width 0.4s; background: linear-gradient(90deg, var(--navy2), var(--gold)); }
    .balance-pct { width: 38px; text-align: right; font-size: 0.72rem; color: var(--gray); }
    .balance-amount { width: 74px; text-align: right; font-weight: 600; color: var(--green); font-size: 0.75rem; }
    .balance-warn {
      margin-top: 8px; padding: 8px 10px;
      background: #FFF8EC; border-left: 3px solid var(--gold2);
      border-radius: 2px; font-size: 0.75rem; color: #92600A; line-height: 1.5;
    }
    .balance-empty { color: var(--gray); font-size: 0.78rem; text-align: center; padding: 12px 0; }

    /* 計算ボタン */
    .btn-calc {
      display: block; width: 100%;
      padding: 16px; background: var(--navy);
      color: #fff; border: none; border-radius: 4px;
      font-size: 1rem; font-weight: 700; letter-spacing: 0.1em;
      cursor: pointer; transition: background 0.2s;
      position: relative; overflow: hidden;
    }
    .btn-calc::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--gold);
    }
    .btn-calc:hover { background: var(--navy2); }

    /* 結果 */
    #result { display: none; }
    .result-meta {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 14px; padding: 10px 14px;
      background: var(--light); border-left: 3px solid var(--gold); border-radius: 2px;
    }
    .result-meta-item { font-size: 0.78rem; color: var(--gray); flex: 1; min-width: 120px; }
    .result-meta-item strong { color: var(--navy); font-size: 0.9rem; }

    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; min-width: 300px; }
    thead th {
      background: var(--navy); color: rgba(255,255,255,0.85);
      padding: 9px 10px; text-align: left;
      font-size: 0.72rem; letter-spacing: 0.08em; font-weight: 600;
    }
    thead th:not(:first-child) { text-align: right; }
    tbody td { padding: 10px; border-bottom: 1px solid #E5EAF2; }
    tbody td:not(:first-child) { text-align: right; }
    tbody tr:hover td { background: #F9FBFF; }
    .td-role { font-weight: 700; color: var(--navy); font-size: 0.95rem; letter-spacing: 0.06em; }
    .td-amount { font-weight: 700; color: var(--green); }
    .td-collect { font-weight: 700; color: var(--navy2); }
    tfoot td {
      padding: 10px; background: var(--navy);
      color: rgba(255,255,255,0.9); font-weight: 700; font-size: 0.84rem;
    }
    tfoot td:not(:first-child) { text-align: right; }
    tfoot .td-amount { color: var(--gold2); font-size: 0.95rem; }

    /* 集金サマリー */
    .collect-summary {
      margin-top: 14px; padding: 12px 14px;
      background: #F0F7FF; border-left: 3px solid var(--navy2);
      border-radius: 2px;
    }
    .collect-summary-title { font-size: 0.7rem; color: var(--navy2); font-weight: 700; letter-spacing: 0.1em; margin-bottom: 6px; }
    .collect-row { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 3px; }
    .collect-row span { color: var(--gray); }
    .collect-row strong { color: var(--navy); }
    .collect-surplus { color: var(--green) !important; font-weight: 700; }

    /* バーチャート */
    .bar-section { margin-top: 16px; }
    .bar-section-title { font-size: 0.7rem; color: var(--gray); letter-spacing: 0.1em; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
    .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.8rem; }
    .bar-label { width: 28px; font-weight: 700; color: var(--navy); }
    .bar-track { flex: 1; height: 12px; background: #E5EAF2; border-radius: 2px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 2px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
    .bar-val { width: 70px; text-align: right; font-weight: 700; color: var(--green); font-size: 0.78rem; }

    .note { font-size: 0.7rem; color: var(--gray); margin-top: 10px; text-align: right; }

    /* MODAL */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,20,50,0.6);
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; border-radius: 4px; border-top: 4px solid var(--gold);
      padding: 28px 24px; width: min(400px, 92vw);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .modal h3 { font-size: 0.85rem; font-weight: 700; color: var(--navy); letter-spacing: 0.1em; margin-bottom: 18px; }
    .modal label { font-size: 0.78rem; color: var(--gray); display: block; margin-bottom: 4px; }
    .modal input[type="text"] {
      width: 100%; padding: 10px 12px; border: 1.5px solid #D1D9E6; border-radius: 4px;
      font-size: 0.95rem; color: var(--navy); font-weight: 600; margin-bottom: 14px;
    }
    .modal input[type="text"]:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,146,42,0.12); }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-modal-cancel { padding: 9px 18px; border: 1.5px solid #D1D9E6; border-radius: 4px; font-size: 0.82rem; cursor: pointer; background: #fff; color: var(--gray); }
    .btn-modal-save { padding: 9px 22px; border: none; border-radius: 4px; font-size: 0.82rem; font-weight: 700; cursor: pointer; background: var(--navy); color: #fff; }

    /* FOOTER */
    footer { background: #001122; color: rgba(255,255,255,0.3); font-size: 0.7rem; text-align: center; padding: 14px; letter-spacing: 0.06em; }

    /* MOBILE */
    @media (max-width: 480px) {
      main { padding: 14px 10px 100px; }
      .card { padding: 14px 12px 12px; }
      .pattern-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .p-name { font-size: 0.72rem; }
      .role-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .round-btn { font-size: 0.75rem; }
    }
  </style>
</head>
<body>

<!-- 設定モーダル -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>会社情報の設定</h3>
    <label>会社名</label>
    <input type="text" id="input-company" placeholder="例：TMNF福島支店" maxlength="30">
    <label>ロゴ文字（2文字）</label>
    <input type="text" id="input-logo" placeholder="例：TM" maxlength="2">
    <div class="modal-btns">
      <button class="btn-modal-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-modal-save" onclick="saveSettings()">保存する</button>
    </div>
  </div>
</div>

<header>
  <div class="logo-mark" id="logo-mark" onclick="openModal()">奉行</div>
  <div class="logo-text" id="logo-text">TMNF割り勘奉行</div>
  <button class="btn-settings" onclick="openModal()">⚙ 会社情報を設定</button>
</header>
<div class="gold-bar"></div>

<div class="hero">
  <div class="hero-eyebrow">COMPANY PARTY SPLIT</div>
  <h1>TMNF<span>割り勘奉行</span></h1>
  <p class="hero-sub">役職・人数・傾斜パターンを選ぶだけで自動計算</p>
</div>

<main>

  <!-- 合計金額 -->
  <div class="card">
    <div class="card-header"><div class="card-header-dot"></div><h2>合計金額</h2></div>
    <div class="total-wrap">
      <input type="number" id="total" placeholder="0" min="0" inputmode="numeric" oninput="updateBalance()">
      <span class="yen">円</span>
    </div>
  </div>

  <!-- 端数処理 -->
  <div class="card">
    <div class="card-header"><div class="card-header-dot"></div><h2>集金単位（端数の切り上げ）</h2></div>
    <div class="round-btns">
      <button class="round-btn" onclick="setRound(1)">切り捨てなし</button>
      <button class="round-btn active" onclick="setRound(100)">100円単位</button>
      <button class="round-btn" onclick="setRound(500)">500円単位</button>
      <button class="round-btn" onclick="setRound(1000)">1,000円単位</button>
    </div>
  </div>

  <!-- 傾斜パターン -->
  <div class="card">
    <div class="card-header"><div class="card-header-dot"></div><h2>傾斜パターン</h2></div>
    <div class="pattern-grid" id="pattern-grid"></div>
  </div>

  <!-- 役職別人数 -->
  <div class="card">
    <div class="card-header"><div class="card-header-dot"></div><h2>役職別人数</h2></div>
    <div class="role-grid" id="role-inputs"></div>
    <!-- バランス試算 -->
    <div class="balance-section">
      <div class="balance-title">▶ 負担バランス試算（1人あたり）</div>
      <div id="balance-preview"><div class="balance-empty">人数を入力すると試算が表示されます</div></div>
    </div>
  </div>

  <button class="btn-calc" onclick="calculate()">計　算　す　る</button>

  <!-- 結果 -->
  <div class="card" id="result" style="margin-top:16px;">
    <div class="card-header"><div class="card-header-dot"></div><h2>計算結果</h2></div>
    <div class="result-meta">
      <div class="result-meta-item">合計金額　<strong id="res-total"></strong></div>
      <div class="result-meta-item">参加者　<strong id="res-count"></strong> 名</div>
      <div class="result-meta-item">パターン　<strong id="res-pattern"></strong></div>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>役職</th>
            <th>人数</th>
            <th>1人あたり</th>
            <th>集金額/人</th>
            <th>小計（集金）</th>
          </tr>
        </thead>
        <tbody id="res-body"></tbody>
        <tfoot id="res-foot"></tfoot>
      </table>
    </div>
    <div class="collect-summary" id="collect-summary"></div>
    <div class="bar-section">
      <div class="bar-section-title">1人あたり集金額（比較）</div>
      <div id="bar-wrap"></div>
    </div>
    <p class="note">※ 集金額は各自の負担額を切り上げた金額です</p>
  </div>

</main>

<footer id="footer-text">TMNF割り勘奉行 — 社内用ツール</footer>

<script>
  /* ── 会社情報 ── */
  function loadSettings() {
    const company = localStorage.getItem("warikan_company") || "";
    const logo    = localStorage.getItem("warikan_logo")    || "";
    if (company) {
      document.getElementById("logo-text").textContent = company;
      document.getElementById("footer-text").textContent = company + " — 社内用ツール";
    }
    if (logo) document.getElementById("logo-mark").textContent = logo.slice(0,2);
  }
  function openModal() {
    document.getElementById("input-company").value = localStorage.getItem("warikan_company") || "";
    document.getElementById("input-logo").value    = localStorage.getItem("warikan_logo")    || "";
    document.getElementById("modal").classList.add("open");
    setTimeout(() => document.getElementById("input-company").focus(), 50);
  }
  function closeModal() { document.getElementById("modal").classList.remove("open"); }
  function saveSettings() {
    const company = document.getElementById("input-company").value.trim();
    const logo    = document.getElementById("input-logo").value.trim();
    if (!company) return alert("会社名を入力してください");
    localStorage.setItem("warikan_company", company);
    localStorage.setItem("warikan_logo", logo || company.slice(0,2));
    loadSettings(); closeModal();
  }
  document.getElementById("modal").addEventListener("click", e => {
    if (e.target === document.getElementById("modal")) closeModal();
  });

  /* ── 定数 ── */
  const ROLES = ["DH","SC","MG","UL","SA","A"];

  // ※均等なし・緩やかに・海をイメージした名称
  const PATTERNS = [
    { name:"さざ波",   desc:"ほんの少し\n差をつける",   rates:[1.5, 1.3, 1.15, 1.05, 1.0, 0.85], heights:[18,14,11,9,8,6] },
    { name:"潮風",     desc:"自然な\n役職差",           rates:[2.0, 1.7,  1.4,  1.15, 1.0, 0.75], heights:[20,16,13,10,8,5] },
    { name:"波風",     desc:"それなりに\n差がつく",     rates:[2.5, 2.0,  1.6,  1.2,  0.9, 0.65], heights:[20,16,12, 9,7,4] },
    { name:"荒波",     desc:"役職の\n重みをしっかり",   rates:[3.2, 2.5,  1.8,  1.2,  0.8, 0.5],  heights:[20,15,11, 7,5,3] },
  ];

  let selectedPattern = 1;
  let roundUnit = 100;

  /* ── 端数処理 ── */
  function setRound(unit) {
    roundUnit = unit;
    document.querySelectorAll(".round-btn").forEach((b, i) => {
      b.classList.toggle("active", [1,100,500,1000][i] === unit);
    });
    updateBalance();
  }

  function roundUp(amount, unit) {
    if (unit <= 1) return amount;
    return Math.ceil(amount / unit) * unit;
  }

  /* ── パターン描画 ── */
  function renderPatterns() {
    document.getElementById("pattern-grid").innerHTML = PATTERNS.map((p, i) => {
      const bars = p.heights.map(h => `<div class="p-bar" style="height:${h}px"></div>`).join("");
      return `<div class="pattern-btn ${i===selectedPattern?"active":""}" onclick="selectPattern(${i})">
        <div class="p-name">${p.name}</div>
        <div class="p-bars">${bars}</div>
        <div class="p-desc">${p.desc.replace("\n","<br>")}</div>
      </div>`;
    }).join("");
  }

  function selectPattern(i) {
    selectedPattern = i;
    renderPatterns();
    updateBalance();
  }

  /* ── 役職人数入力 ── */
  function renderInputs() {
    document.getElementById("role-inputs").innerHTML = ROLES.map((r, i) => `
      <div class="role-item">
        <div class="role-label"><span class="role-name">${r}</span></div>
        <input type="number" id="count-${i}" min="0" value="0" placeholder="0"
               inputmode="numeric" oninput="updateBalance()">
      </div>
    `).join("");
  }

  /* ── バランス試算（リアルタイム） ── */
  function updateBalance() {
    const total  = parseInt(document.getElementById("total").value) || 0;
    const rates  = PATTERNS[selectedPattern].rates;
    const counts = ROLES.map((_, i) => parseInt(document.getElementById(`count-${i}`)?.value) || 0);
    const totalPeople = counts.reduce((s,c) => s+c, 0);
    const el = document.getElementById("balance-preview");

    if (totalPeople === 0 || total === 0) {
      el.innerHTML = `<div class="balance-empty">人数と合計金額を入力すると試算が表示されます</div>`;
      return;
    }

    const totalRate = counts.reduce((s,c,i) => s + c * rates[i], 0);
    const unit = total / totalRate;

    // 各役職の1人あたり理論値
    const perPerson = rates.map(r => unit * r);
    // 最大値（バー基準）
    const maxPP = Math.max(...ROLES.map((_,i) => counts[i] > 0 ? perPerson[i] : 0));

    // 偏り警告チェック
    const warnings = [];
    ROLES.forEach((r, i) => {
      if (counts[i] === 0) return;
      const share = (counts[i] * perPerson[i]) / total * 100;
      const personShare = perPerson[i] / total * 100;
      // 1人が総額の40%以上なら警告
      if (counts[i] === 1 && share > 40) {
        warnings.push(`${r} の1名で全体の${share.toFixed(0)}%（${Math.round(perPerson[i]).toLocaleString()}円）を負担します`);
      }
    });

    let html = ROLES.map((r, i) => {
      if (counts[i] === 0) return "";
      const pp  = perPerson[i];
      const pct = maxPP > 0 ? (pp / maxPP * 100).toFixed(0) : 0;
      const collected = roundUp(pp, roundUnit);
      return `<div class="balance-row">
        <span class="balance-label">${r}</span>
        <div class="balance-track"><div class="balance-fill" style="width:${pct}%"></div></div>
        <span class="balance-pct">${Math.round(pp).toLocaleString()}円</span>
        <span class="balance-amount">→ ${collected.toLocaleString()}円</span>
      </div>`;
    }).join("");

    if (warnings.length) {
      html += `<div class="balance-warn">⚠️ ${warnings.join("<br>")}<br>パターンを「さざ波」や「潮風」に変えると緩和できます。</div>`;
    }

    el.innerHTML = html;
  }

  /* ── 計算 ── */
  function calculate() {
    const total = parseInt(document.getElementById("total").value);
    if (!total || total <= 0) return alert("合計金額を入力してください");

    const rates  = PATTERNS[selectedPattern].rates;
    const counts = ROLES.map((_, i) => parseInt(document.getElementById(`count-${i}`).value) || 0);
    const totalPeople = counts.reduce((s,c) => s+c, 0);
    if (totalPeople === 0) return alert("参加者の人数を入力してください");

    const totalRate = counts.reduce((s,c,i) => s + c * rates[i], 0);
    const unit = total / totalRate;

    // 理論値・切り上げ集金額
    const perPersonExact    = rates.map(r => unit * r);
    const perPersonCollect  = perPersonExact.map(r => roundUp(r, roundUnit));
    const subtotalCollect   = counts.map((c,i) => c * perPersonCollect[i]);
    const subtotalExact     = counts.map((c,i) => Math.round(c * perPersonExact[i]));

    const grandCollect = subtotalCollect.reduce((s,v) => s+v, 0);
    const surplus      = grandCollect - total;

    let rows = "";
    let grandCount = 0;
    const maxCollect = Math.max(...ROLES.map((_,i) => counts[i]>0 ? perPersonCollect[i] : 0));

    ROLES.forEach((r, i) => {
      if (counts[i] === 0) return;
      grandCount += counts[i];
      rows += `<tr>
        <td class="td-role">${r}</td>
        <td>${counts[i]} 名</td>
        <td class="td-amount">${Math.round(perPersonExact[i]).toLocaleString()} 円</td>
        <td class="td-collect">${perPersonCollect[i].toLocaleString()} 円</td>
        <td class="td-collect">${subtotalCollect[i].toLocaleString()} 円</td>
      </tr>`;
    });

    document.getElementById("res-body").innerHTML = rows;
    document.getElementById("res-foot").innerHTML = `<tr>
      <td>合　計</td><td>${grandCount} 名</td><td>—</td><td>—</td>
      <td class="td-amount">${grandCollect.toLocaleString()} 円</td>
    </tr>`;

    // 集金サマリー
    document.getElementById("collect-summary").innerHTML = `
      <div class="collect-summary-title">COLLECTION SUMMARY</div>
      <div class="collect-row"><span>飲み会の実費</span><strong>${total.toLocaleString()} 円</strong></div>
      <div class="collect-row"><span>集金合計</span><strong>${grandCollect.toLocaleString()} 円</strong></div>
      <div class="collect-row"><span>余剰金（次回積立など）</span><strong class="collect-surplus">＋${surplus.toLocaleString()} 円</strong></div>
    `;

    // バーチャート
    document.getElementById("bar-wrap").innerHTML = ROLES.map((r, i) => {
      if (counts[i] === 0) return "";
      const pct = maxCollect > 0 ? (perPersonCollect[i] / maxCollect * 100).toFixed(0) : 0;
      return `<div class="bar-row">
        <span class="bar-label">${r}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <span class="bar-val">${perPersonCollect[i].toLocaleString()}円</span>
      </div>`;
    }).join("");

    document.getElementById("res-total").textContent  = total.toLocaleString() + " 円";
    document.getElementById("res-count").textContent  = totalPeople;
    document.getElementById("res-pattern").textContent = PATTERNS[selectedPattern].name;

    const el = document.getElementById("result");
    el.style.display = "block";
    el.scrollIntoView({ behavior: "smooth" });
  }

  /* ── 初期化 ── */
  loadSettings();
  renderPatterns();
  renderInputs();
</script>
