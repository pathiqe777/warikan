<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMNF割り勘奉行</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #F0F4FF;
      --white:  #ffffff;
      --navy:   #1A237E;
      --coral:  #FF6B6B;
      --teal:   #00BFA5;
      --yellow: #FFD600;
      --purple: #7C4DFF;
      --orange: #FF6D00;
      --text:   #2D2D2D;
      --gray:   #9E9E9E;
      --light:  #F5F5F5;
    }
    body {
      font-family: "M PLUS Rounded 1c", "Hiragino Kaku Gothic ProN", sans-serif;
      background: linear-gradient(160deg, #E8EEFF 0%, #F0FFF8 100%);
      min-height: 100vh;
      color: var(--text);
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #1A237E 0%, #283593 60%, #3949AB 100%);
      padding: 0 20px;
      height: 58px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 4px 20px rgba(26,35,126,0.3);
      position: sticky; top: 0; z-index: 50;
    }
    .logo-wrap { display: flex; align-items: center; gap: 10px; }
    .logo-emoji { font-size: 1.6rem; }
    .logo-title {
      color: #fff; font-size: 1rem; font-weight: 800;
      letter-spacing: 0.02em;
    }
    .logo-title span { color: var(--yellow); }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #1A237E 0%, #3949AB 50%, #5C6BC0 100%);
      padding: 28px 20px 40px;
      text-align: center; position: relative; overflow: hidden;
    }
    .hero::before {
      content: "🍺";
      position: absolute; font-size: 8rem; opacity: 0.06;
      right: -10px; top: -10px; transform: rotate(20deg);
    }
    .hero::after {
      content: "🎉";
      position: absolute; font-size: 6rem; opacity: 0.06;
      left: -10px; bottom: -10px; transform: rotate(-15deg);
    }
    .hero-badge {
      display: inline-block;
      background: var(--yellow);
      color: var(--navy); font-size: 0.68rem; font-weight: 800;
      padding: 3px 12px; border-radius: 20px;
      letter-spacing: 0.1em; margin-bottom: 12px;
    }
    .hero h1 {
      color: #fff; font-size: clamp(1.5rem, 6vw, 2.2rem);
      font-weight: 900; line-height: 1.2;
    }
    .hero h1 em { font-style: normal; color: var(--yellow); }
    .hero-sub {
      color: rgba(255,255,255,0.65); font-size: 0.78rem;
      margin-top: 8px; font-weight: 400;
    }
    /* 波形装飾 */
    .hero-wave {
      position: absolute; bottom: -1px; left: 0; right: 0;
      height: 24px; overflow: hidden;
    }
    .hero-wave svg { display: block; width: 100%; height: 100%; }

    /* MAIN */
    main { max-width: 640px; margin: 0 auto; padding: 20px 14px 100px; }

    /* CARD */
    .card {
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 20px 18px;
      margin-bottom: 16px;
    }
    .card-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.82rem; font-weight: 800; color: var(--navy);
      letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 14px;
    }
    .card-title .icon {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
    }

    /* 合計金額 */
    .total-wrap { position: relative; }
    .total-wrap input {
      width: 100%;
      padding: 14px 48px 14px 20px;
      border: 2.5px solid #E0E0E0;
      border-radius: 14px;
      font-size: 1.8rem; font-weight: 900;
      color: var(--navy);
      font-family: "M PLUS Rounded 1c", sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #FAFAFE;
    }
    .total-wrap input:focus {
      outline: none; border-color: var(--purple);
      box-shadow: 0 0 0 4px rgba(124,77,255,0.12);
      background: #fff;
    }
    .total-wrap .yen {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      font-size: 1rem; font-weight: 800; color: var(--gray);
    }

    /* 端数処理 */
    .round-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .round-btn {
      padding: 10px 4px;
      border: 2px solid #E0E0E0; border-radius: 12px;
      background: var(--light); cursor: pointer;
      font-size: 0.72rem; font-weight: 700; color: var(--gray);
      text-align: center; transition: all 0.15s;
      font-family: "M PLUS Rounded 1c", sans-serif;
    }
    .round-btn:hover { border-color: var(--purple); color: var(--purple); }
    .round-btn.active {
      border-color: var(--purple); background: #EDE7FF;
      color: var(--purple); box-shadow: 0 2px 8px rgba(124,77,255,0.2);
    }

    /* 傾斜パターン */
    .pattern-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .pattern-btn {
      padding: 14px 10px;
      border: 2.5px solid #E0E0E0; border-radius: 16px;
      background: var(--light); cursor: pointer;
      text-align: center; transition: all 0.18s;
      position: relative; overflow: hidden;
    }
    .pattern-btn::before {
      content: ""; position: absolute; inset: 0;
      opacity: 0; transition: opacity 0.18s;
    }
    .pattern-btn:nth-child(1)::before { background: linear-gradient(135deg, #E3F2FD, #B3E5FC); }
    .pattern-btn:nth-child(2)::before { background: linear-gradient(135deg, #E8F5E9, #B2DFDB); }
    .pattern-btn:nth-child(3)::before { background: linear-gradient(135deg, #FFF8E1, #FFE082); }
    .pattern-btn:nth-child(4)::before { background: linear-gradient(135deg, #FCE4EC, #F8BBD0); }
    .pattern-btn.active::before { opacity: 1; }
    .pattern-btn:nth-child(1) { --pc: #0288D1; }
    .pattern-btn:nth-child(2) { --pc: #00897B; }
    .pattern-btn:nth-child(3) { --pc: #F57F17; }
    .pattern-btn:nth-child(4) { --pc: #C2185B; }
    .pattern-btn.active { border-color: var(--pc, var(--purple)); }
    .p-emoji { font-size: 1.6rem; display: block; margin-bottom: 6px; position: relative; z-index: 1; }
    .p-name {
      font-size: 0.9rem; font-weight: 800; color: var(--text);
      margin-bottom: 4px; position: relative; z-index: 1;
    }
    .pattern-btn.active .p-name { color: var(--pc, var(--purple)); }
    .p-bars {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 3px; height: 18px; margin-bottom: 4px;
      position: relative; z-index: 1;
    }
    .p-bar { width: 5px; background: #D0D0D0; border-radius: 2px; }
    .pattern-btn.active .p-bar { background: var(--pc, var(--purple)); }
    .p-desc { font-size: 0.65rem; color: var(--gray); position: relative; z-index: 1; line-height: 1.4; }
    .pattern-btn.active .p-desc { color: var(--pc, var(--purple)); }

    /* ステッパー（役職人数選択） */
    .role-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .role-item {
      background: var(--light); border-radius: 14px; padding: 12px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .role-name-badge {
      font-size: 1rem; font-weight: 900; color: var(--navy);
      letter-spacing: 0.08em;
    }
    .stepper {
      display: flex; align-items: center; gap: 0;
      background: #fff; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden; width: 100%;
    }
    .stepper-btn {
      width: 40px; height: 40px;
      border: none; background: none; cursor: pointer;
      font-size: 1.3rem; font-weight: 900; color: var(--navy);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; flex-shrink: 0;
      font-family: "M PLUS Rounded 1c", sans-serif;
    }
    .stepper-btn:active { background: #E8EAF6; }
    .stepper-btn.minus { color: var(--coral); }
    .stepper-btn.plus  { color: var(--teal);  }
    .stepper-val {
      flex: 1; text-align: center;
      font-size: 1.3rem; font-weight: 900; color: var(--navy);
      font-family: "M PLUS Rounded 1c", sans-serif;
      min-width: 32px;
    }
    .stepper-val.zero { color: var(--gray); }

    /* バランス試算 */
    .balance-section { margin-top: 16px; }
    .balance-title {
      font-size: 0.72rem; font-weight: 800; color: var(--gray);
      letter-spacing: 0.08em; margin-bottom: 8px; text-transform: uppercase;
    }
    .balance-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px; font-size: 0.78rem;
    }
    .balance-label { width: 30px; font-weight: 800; color: var(--navy); }
    .balance-track { flex: 1; height: 10px; background: #E0E0E0; border-radius: 5px; overflow: hidden; }
    .balance-fill { height: 100%; border-radius: 5px; transition: width 0.4s; background: linear-gradient(90deg, var(--teal), var(--purple)); }
    .balance-amount { width: 72px; text-align: right; font-weight: 800; color: var(--purple); font-size: 0.75rem; }
    .balance-empty { color: var(--gray); font-size: 0.78rem; text-align: center; padding: 10px 0; }
    .balance-warn {
      margin-top: 8px; padding: 10px 12px;
      background: #FFF3E0; border-left: 4px solid var(--orange);
      border-radius: 10px; font-size: 0.75rem; color: #E65100; line-height: 1.6;
    }

    /* 計算ボタン */
    .btn-calc {
      display: block; width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--coral), var(--orange));
      color: #fff; border: none; border-radius: 16px;
      font-size: 1.05rem; font-weight: 900; letter-spacing: 0.08em;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 6px 20px rgba(255,107,107,0.4);
      font-family: "M PLUS Rounded 1c", sans-serif;
    }
    .btn-calc:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,107,107,0.45); }
    .btn-calc:active { transform: translateY(0); }

    /* 結果カード */
    #result { display: none; }
    .result-chips {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
    }
    .result-chip {
      background: var(--light); border-radius: 20px;
      padding: 5px 14px; font-size: 0.75rem; font-weight: 700; color: var(--navy);
    }
    .result-chip strong { color: var(--purple); }

    /* 結果テーブル */
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; min-width: 280px; }
    thead th {
      background: var(--navy); color: rgba(255,255,255,0.9);
      padding: 10px 12px; text-align: left;
      font-size: 0.72rem; letter-spacing: 0.08em; font-weight: 800;
    }
    thead th:not(:first-child) { text-align: right; }
    tbody td { padding: 11px 12px; border-bottom: 1px solid #F0F0F0; }
    tbody td:not(:first-child) { text-align: right; }
    tbody tr:last-child td { border-bottom: none; }
    .td-role { font-weight: 900; color: var(--navy); font-size: 1rem; letter-spacing: 0.06em; }
    .td-amount { font-weight: 700; color: #00695C; }
    .td-collect { font-weight: 900; color: var(--purple); }
    tfoot td { padding: 11px 12px; background: #F5F0FF; font-weight: 900; font-size: 0.85rem; }
    tfoot td:not(:first-child) { text-align: right; }
    tfoot .td-collect { color: var(--purple); font-size: 1rem; }

    /* 集金サマリー */
    .collect-summary {
      margin-top: 12px; padding: 14px 16px;
      background: linear-gradient(135deg, #EDE7FF, #E3F2FD);
      border-radius: 14px;
    }
    .collect-summary-title {
      font-size: 0.7rem; color: var(--purple); font-weight: 800;
      letter-spacing: 0.1em; margin-bottom: 8px;
    }
    .collect-row { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 4px; }
    .collect-row span { color: var(--gray); font-weight: 700; }
    .collect-row strong { color: var(--navy); font-weight: 800; }
    .collect-surplus { color: var(--teal) !important; }

    /* バーチャート */
    .bar-section { margin-top: 16px; }
    .bar-title { font-size: 0.7rem; font-weight: 800; color: var(--gray); letter-spacing: 0.08em; margin-bottom: 8px; text-transform: uppercase; }
    .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .bar-label { width: 30px; font-weight: 900; color: var(--navy); font-size: 0.82rem; }
    .bar-track { flex: 1; height: 14px; background: #EEE; border-radius: 7px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 7px; background: linear-gradient(90deg, var(--teal), var(--purple)); transition: width 0.5s cubic-bezier(.4,0,.2,1); }
    .bar-val { width: 72px; text-align: right; font-weight: 800; color: var(--purple); font-size: 0.78rem; }

    .note { font-size: 0.68rem; color: var(--gray); margin-top: 10px; text-align: right; font-weight: 700; }

    /* FOOTER */
    footer {
      background: var(--navy); color: rgba(255,255,255,0.4);
      font-size: 0.7rem; text-align: center; padding: 14px;
      font-weight: 700; letter-spacing: 0.06em;
    }

    @media (max-width: 380px) {
      .role-grid { grid-template-columns: repeat(2, 1fr); }
      .stepper-btn { width: 36px; height: 36px; }
      .stepper-val { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <span class="logo-emoji">⚖️</span>
    <div class="logo-title">TMNF<span>割り勘奉行</span></div>
  </div>
</header>

<div class="hero">
  <div class="hero-badge">🍺 COMPANY PARTY SPLIT 🎉</div>
  <h1>役職別<em>傾斜割り勘</em><br>計算機</h1>
  <p class="hero-sub">人数を選んでパターンを選ぶだけ！かんたん計算✨</p>
  <div class="hero-wave">
    <svg viewBox="0 0 1200 24" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,12 C200,24 400,0 600,12 C800,24 1000,0 1200,12 L1200,24 L0,24 Z" fill="#F0F4FF"/>
    </svg>
  </div>
</div>

<main>

  <!-- 合計金額 -->
  <div class="card">
    <div class="card-title">
      <div class="icon" style="background:#EDE7FF">💰</div>
      合計金額
    </div>
    <div class="total-wrap">
      <input type="number" id="total" placeholder="0" min="0" inputmode="numeric" oninput="updateBalance()">
      <span class="yen">円</span>
    </div>
  </div>

  <!-- 端数処理 -->
  <div class="card">
    <div class="card-title">
      <div class="icon" style="background:#E8F5E9">🪙</div>
      集金単位（端数の切り上げ）
    </div>
    <div class="round-grid">
      <button class="round-btn" onclick="setRound(1)">そのまま</button>
      <button class="round-btn active" onclick="setRound(100)">100円</button>
      <button class="round-btn" onclick="setRound(500)">500円</button>
      <button class="round-btn" onclick="setRound(1000)">1,000円</button>
    </div>
  </div>

  <!-- 傾斜パターン -->
  <div class="card">
    <div class="card-title">
      <div class="icon" style="background:#FFF8E1">📊</div>
      傾斜パターン
    </div>
    <div class="pattern-grid" id="pattern-grid"></div>
  </div>

  <!-- 役職別人数 -->
  <div class="card">
    <div class="card-title">
      <div class="icon" style="background:#FCE4EC">👥</div>
      役職別人数
    </div>
    <div class="role-grid" id="role-inputs"></div>
    <div class="balance-section">
      <div class="balance-title">📈 負担バランス試算</div>
      <div id="balance-preview"><div class="balance-empty">人数と金額を入力すると試算が表示されます</div></div>
    </div>
  </div>

  <button class="btn-calc" onclick="calculate()">🍺 割り勘を計算する！</button>

  <!-- 結果 -->
  <div class="card" id="result" style="margin-top:16px;">
    <div class="card-title">
      <div class="icon" style="background:#E8F5E9">✅</div>
      計算結果
    </div>
    <div class="result-chips">
      <div class="result-chip">合計 <strong id="res-total"></strong></div>
      <div class="result-chip">参加者 <strong id="res-count"></strong> 名</div>
      <div class="result-chip">パターン <strong id="res-pattern"></strong></div>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>役職</th>
            <th>人数</th>
            <th>1人あたり</th>
            <th>集金額/人</th>
            <th>小計</th>
          </tr>
        </thead>
        <tbody id="res-body"></tbody>
        <tfoot id="res-foot"></tfoot>
      </table>
    </div>
    <div class="collect-summary" id="collect-summary"></div>
    <div class="bar-section">
      <div class="bar-title">👆 1人あたり集金額の比較</div>
      <div id="bar-wrap"></div>
    </div>
    <p class="note">※ 集金額は負担額を切り上げた金額です</p>
  </div>

</main>

<footer>⚖️ TMNF割り勘奉行 — 社内用ツール</footer>

<script>
  const ROLES = ["DH","SC","MG","UL","SA","A"];

  const PATTERNS = [
    {
      name:"気持ち傾斜", emoji:"🌊", desc:"ほんのり\n差をつける",
      rates:[1.5, 1.3, 1.15, 1.05, 1.0, 0.85],
      heights:[18,14,11,9,8,6]
    },
    {
      name:"普通", emoji:"⚖️", desc:"自然な\n役職の差",
      rates:[2.2, 1.8, 1.4, 1.15, 0.95, 0.7],
      heights:[20,16,12,10,8,5]
    },
    {
      name:"太っ腹", emoji:"😄", desc:"上がそれなりに\nドカンと負担",
      rates:[3.0, 2.3, 1.7, 1.2, 0.8, 0.55],
      heights:[20,15,11,8,5,3]
    },
    {
      name:"大盤振る舞い", emoji:"🎊", desc:"上位が\nがっつり持つ！",
      rates:[4.0, 2.8, 1.9, 1.1, 0.65, 0.4],
      heights:[20,14,9,6,3,2]
    },
  ];

  let selectedPattern = 1;
  let roundUnit = 100;
  const counts = [0, 0, 0, 0, 0, 0];

  /* ── 端数処理 ── */
  function setRound(unit) {
    roundUnit = unit;
    document.querySelectorAll(".round-btn").forEach((b, i) => {
      b.classList.toggle("active", [1,100,500,1000][i] === unit);
    });
    updateBalance();
  }
  function roundUp(v, unit) {
    if (unit <= 1) return Math.round(v);
    return Math.ceil(v / unit) * unit;
  }

  /* ── パターン ── */
  function renderPatterns() {
    document.getElementById("pattern-grid").innerHTML = PATTERNS.map((p, i) => {
      const bars = p.heights.map(h => `<div class="p-bar" style="height:${h}px"></div>`).join("");
      return `<div class="pattern-btn ${i===selectedPattern?"active":""}" onclick="selectPattern(${i})">
        <span class="p-emoji">${p.emoji}</span>
        <div class="p-name">${p.name}</div>
        <div class="p-bars">${bars}</div>
        <div class="p-desc">${p.desc.replace("\n","<br>")}</div>
      </div>`;
    }).join("");
  }
  function selectPattern(i) {
    selectedPattern = i;
    renderPatterns();
    updateBalance();
  }

  /* ── ステッパー ── */
  function renderInputs() {
    document.getElementById("role-inputs").innerHTML = ROLES.map((r, i) => `
      <div class="role-item">
        <div class="role-name-badge">${r}</div>
        <div class="stepper">
          <button class="stepper-btn minus" onclick="changeCount(${i}, -1)">−</button>
          <span class="stepper-val ${counts[i]===0?'zero':''}" id="sv-${i}">${counts[i]}</span>
          <button class="stepper-btn plus"  onclick="changeCount(${i}, +1)">＋</button>
        </div>
      </div>
    `).join("");
  }

  function changeCount(i, delta) {
    counts[i] = Math.max(0, counts[i] + delta);
    const el = document.getElementById(`sv-${i}`);
    el.textContent = counts[i];
    el.className = "stepper-val" + (counts[i] === 0 ? " zero" : "");
    updateBalance();
  }

  /* ── バランス試算 ── */
  function updateBalance() {
    const total = parseInt(document.getElementById("total").value) || 0;
    const rates = PATTERNS[selectedPattern].rates;
    const totalPeople = counts.reduce((s,c) => s+c, 0);
    const el = document.getElementById("balance-preview");

    if (totalPeople === 0 || total === 0) {
      el.innerHTML = `<div class="balance-empty">人数と合計金額を入力すると試算が表示されます</div>`;
      return;
    }

    const totalRate = counts.reduce((s,c,i) => s + c * rates[i], 0);
    const unit = total / totalRate;
    const perPerson = rates.map(r => unit * r);
    const maxPP = Math.max(...ROLES.map((_,i) => counts[i] > 0 ? perPerson[i] : 0));

    const warnings = [];
    ROLES.forEach((r, i) => {
      if (counts[i] !== 1) return;
      const share = (perPerson[i] / total * 100);
      if (share > 40) warnings.push(`⚠️ ${r} の1名が全体の${share.toFixed(0)}%（${Math.round(perPerson[i]).toLocaleString()}円）を負担します`);
    });

    let html = ROLES.map((r, i) => {
      if (counts[i] === 0) return "";
      const pct = maxPP > 0 ? (perPerson[i] / maxPP * 100).toFixed(0) : 0;
      const collected = roundUp(perPerson[i], roundUnit);
      return `<div class="balance-row">
        <span class="balance-label">${r}</span>
        <div class="balance-track"><div class="balance-fill" style="width:${pct}%"></div></div>
        <span class="balance-amount">${collected.toLocaleString()}円</span>
      </div>`;
    }).join("");

    if (warnings.length) {
      html += `<div class="balance-warn">${warnings.join("<br>")}<br>「気持ち傾斜」か「普通」に変えると緩和できます。</div>`;
    }
    el.innerHTML = html;
  }

  /* ── 計算 ── */
  function calculate() {
    const total = parseInt(document.getElementById("total").value);
    if (!total || total <= 0) return alert("合計金額を入力してください");
    const totalPeople = counts.reduce((s,c) => s+c, 0);
    if (totalPeople === 0) return alert("参加者の人数を選択してください");

    const rates = PATTERNS[selectedPattern].rates;
    const totalRate = counts.reduce((s,c,i) => s + c * rates[i], 0);
    const unit = total / totalRate;

    const perExact   = rates.map(r => unit * r);
    const perCollect = perExact.map(v => roundUp(v, roundUnit));
    const subCollect = counts.map((c,i) => c * perCollect[i]);
    const grandCollect = subCollect.reduce((s,v) => s+v, 0);
    const surplus = grandCollect - total;
    const maxCollect = Math.max(...ROLES.map((_,i) => counts[i]>0 ? perCollect[i] : 0));

    let rows = "";
    let grandCount = 0;
    ROLES.forEach((r, i) => {
      if (counts[i] === 0) return;
      grandCount += counts[i];
      rows += `<tr>
        <td class="td-role">${r}</td>
        <td>${counts[i]} 名</td>
        <td class="td-amount">${Math.round(perExact[i]).toLocaleString()}円</td>
        <td class="td-collect">${perCollect[i].toLocaleString()}円</td>
        <td class="td-collect">${subCollect[i].toLocaleString()}円</td>
      </tr>`;
    });
    document.getElementById("res-body").innerHTML = rows;
    document.getElementById("res-foot").innerHTML = `<tr>
      <td>合計</td><td>${grandCount}名</td><td>—</td><td>—</td>
      <td class="td-collect">${grandCollect.toLocaleString()}円</td>
    </tr>`;

    document.getElementById("collect-summary").innerHTML = `
      <div class="collect-summary-title">💰 COLLECTION SUMMARY</div>
      <div class="collect-row"><span>飲み会の実費</span><strong>${total.toLocaleString()} 円</strong></div>
      <div class="collect-row"><span>集金合計</span><strong>${grandCollect.toLocaleString()} 円</strong></div>
      <div class="collect-row"><span>余剰金（次回積立など）</span><strong class="collect-surplus">＋${surplus.toLocaleString()} 円 🎉</strong></div>
    `;

    document.getElementById("bar-wrap").innerHTML = ROLES.map((r, i) => {
      if (counts[i] === 0) return "";
      const pct = maxCollect > 0 ? (perCollect[i] / maxCollect * 100).toFixed(0) : 0;
      return `<div class="bar-row">
        <span class="bar-label">${r}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <span class="bar-val">${perCollect[i].toLocaleString()}円</span>
      </div>`;
    }).join("");

    document.getElementById("res-total").textContent   = total.toLocaleString() + " 円";
    document.getElementById("res-count").textContent   = totalPeople;
    document.getElementById("res-pattern").textContent = PATTERNS[selectedPattern].name;

    const el = document.getElementById("result");
    el.style.display = "block";
    el.scrollIntoView({ behavior: "smooth" });
  }

  /* ── 初期化 ── */
  renderPatterns();
  renderInputs();
</script>
</body>
</html>
